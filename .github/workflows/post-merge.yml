name: Post Merge

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  issues: write

jobs:
  documentation:
    # [docs] 커밋으로 인한 무한 루프 방지
    if: ${{ !startsWith(github.event.head_commit.message, '[docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate documentation
        uses: ./
        with:
          mode: docs
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}

  issue-detection:
    # [docs] 커밋으로 인한 무한 루프 방지
    if: ${{ !startsWith(github.event.head_commit.message, '[docs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect issues
        uses: ./
        with:
          mode: issue
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
