name: Deep Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  deep-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run deep review
        uses: ./
        with:
          mode: deep
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
