name: Light Review

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  light-review:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            publish: true
          - runner: self-hosted
            publish: false
    runs-on: ${{ matrix.runner }}
    env:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run light review
        id: review
        uses: ./.github/actions/light-review
        with:
          output-path: artifacts/light-review/${{ github.sha }}.md

      - name: Upload light review artifact
        uses: actions/upload-artifact@v4
        with:
          name: light-review-${{ matrix.runner }}
          path: artifacts/light-review/${{ github.sha }}.md
          if-no-files-found: error

      - name: Publish commit comment
        if: matrix.publish == true
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          REPORT_FILE: artifacts/light-review/${{ github.sha }}.md
        run: |
          set -euo pipefail
          body="$(cat "${REPORT_FILE}")"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/comments" \
            -f body="${body}"
