name: Light Review

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  light-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run light review
        uses: ./
        with:
          mode: light
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
