name: Documentation
description: Generate post-merge documentation via Codex CLI.
inputs:
  codex-version:
    description: Codex CLI version.
    default: "0.5.0"
  model:
    description: Codex model to use.
    default: "gpt-5"
  prompt-file:
    description: Prompt file path.
    default: "prompts/documentation.md"
  output-path:
    description: Markdown file path to write.
    default: "docs/generated/documentation.md"
  extra-args:
    description: Additional CLI args (newline separated, optional).
    default: ""
outputs:
  report-path:
    description: Location of generated documentation.
    value: ${{ steps.run.outputs.report_path }}
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-codex-cli
      with:
        codex-version: ${{ inputs.codex-version }}

    - name: Generate documentation
      id: run
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -euo pipefail
        chmod +x scripts/run_codex_cli.sh
        if [[ -n "${EXTRA_ARGS}" ]]; then
          mapfile -t extra <<< "${EXTRA_ARGS}"
          scripts/run_codex_cli.sh "${MODEL}" "${PROMPT_FILE}" "${OUTPUT_PATH}" "docs" "${extra[@]}"
        else
          scripts/run_codex_cli.sh "${MODEL}" "${PROMPT_FILE}" "${OUTPUT_PATH}" "docs"
        fi
        echo "report_path=${OUTPUT_PATH}" >> "${GITHUB_OUTPUT}"
