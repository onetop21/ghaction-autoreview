name: Light Review
description: Run Codex CLI light review prompt and capture a report.
inputs:
  codex-version:
    description: Codex CLI version.
    default: "0.5.0"
  model:
    description: Codex model to use.
    default: "gpt-5-codex"
  prompt-file:
    description: Prompt file path.
    default: "prompts/light-review.md"
  output-path:
    description: Report path relative to workspace.
    default: "artifacts/light-review/report.md"
  extra-args:
    description: Additional CLI args (newline separated, optional).
    default: ""
outputs:
  report-path:
    description: Location of generated report.
    value: ${{ steps.run.outputs.report_path }}
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-codex-cli
      with:
        codex-version: ${{ inputs.codex-version }}

    - name: Run light review
      id: run
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        PROMPT_FILE: ${{ inputs.prompt-file }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        set -euo pipefail
        chmod +x scripts/run_codex_cli.sh
        if [[ -n "${EXTRA_ARGS}" ]]; then
          mapfile -t extra <<< "${EXTRA_ARGS}"
          scripts/run_codex_cli.sh "${MODEL}" "${PROMPT_FILE}" "${OUTPUT_PATH}" "light" "${extra[@]}"
        else
          scripts/run_codex_cli.sh "${MODEL}" "${PROMPT_FILE}" "${OUTPUT_PATH}" "light"
        fi
        echo "report_path=${OUTPUT_PATH}" >> "${GITHUB_OUTPUT}"
