name: Codex Auto Review
description: Codex CLI 기반 리뷰/문서화/이슈 감지를 실행합니다.
inputs:
  mode:
    description: 실행할 모듈 (light, deep, docs, issue).
    required: true
  codex-version:
    description: 설치할 Codex CLI 버전.
    default: "0.5.0"
  model:
    description: Codex 모델 ID (미지정 시 모드별 기본값 사용).
    default: ""
  prompt-file:
    description: 사용할 프롬프트 파일 경로 (미지정 시 모드별 기본값 사용).
    default: ""
  output-path:
    description: 리포트 또는 문서 출력 경로 (미지정 시 모드별 기본값 사용).
    default: ""
  extra-args:
    description: Codex CLI에 추가로 전달할 옵션(개행 구분).
    default: ""
outputs:
  report-path:
    description: 생성된 리포트/문서 경로.
    value: ${{ steps.light.outputs.report-path || steps.deep.outputs.report-path || steps.docs.outputs.report-path || steps.issue.outputs.report-path }}
  issue-required:
    description: Issue Up 모드에서 이슈 작성이 필요한 경우 true.
    value: ${{ steps.issue.outputs.issue-required || 'false' }}
runs:
  using: composite
  steps:
    - name: 모드 검증
      id: validate
      shell: bash
      env:
        MODE_INPUT: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        mode="$(echo "${MODE_INPUT}" | tr '[:upper:]' '[:lower:]')"
        case "${mode}" in
          light|deep|docs|issue) ;;
          *) echo "지원하지 않는 mode 값입니다: ${MODE_INPUT}" >&2; exit 1 ;;
        esac
        echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

    - name: 파라미터 계산
      id: params
      shell: bash
      env:
        MODE: ${{ steps.validate.outputs.mode }}
        PROMPT_INPUT: ${{ inputs.prompt-file }}
        OUTPUT_INPUT: ${{ inputs.output-path }}
        MODEL_INPUT: ${{ inputs.model }}
      run: |
        set -euo pipefail

        mode="${MODE}"
        case "${mode}" in
          light)
            default_prompt="prompts/light-review.md"
            default_output="codex/reports/light-review.md"
            default_model="gpt-5-codex"
            ;;
          deep)
            default_prompt="prompts/deep-review.md"
            default_output="codex/reports/deep-review.md"
            default_model="gpt-5-codex"
            ;;
          docs)
            default_prompt="prompts/documentation.md"
            default_output="codex/docs/latest.md"
            default_model="gpt-5"
            ;;
          issue)
            default_prompt="prompts/issue-up.md"
            default_output="codex/reports/issue-up.md"
            default_model="gpt-5"
            ;;
          *)
            echo "알 수 없는 mode 값입니다: ${mode}" >&2
            exit 1
            ;;
        esac

        prompt="${PROMPT_INPUT}"
        if [[ -z "${prompt}" ]]; then
          prompt="${default_prompt}"
        fi

        output="${OUTPUT_INPUT}"
        if [[ -z "${output}" ]]; then
          output="${default_output}"
        fi

        model="${MODEL_INPUT}"
        if [[ -z "${model}" ]]; then
          model="${default_model}"
        fi

        {
          echo "mode=${mode}"
          echo "prompt=${prompt}"
          echo "output=${output}"
          echo "model=${model}"
        } >> "${GITHUB_OUTPUT}"

    - name: Light 리뷰 실행
      if: steps.params.outputs.mode == 'light'
      id: light
      uses: ./.github/actions/light-review
      with:
        codex-version: ${{ inputs.codex-version }}
        model: ${{ steps.params.outputs.model }}
        prompt-file: ${{ steps.params.outputs.prompt }}
        output-path: ${{ steps.params.outputs.output }}
        extra-args: ${{ inputs.extra-args }}

    - name: Deep 리뷰 실행
      if: steps.params.outputs.mode == 'deep'
      id: deep
      uses: ./.github/actions/deep-review
      with:
        codex-version: ${{ inputs.codex-version }}
        model: ${{ steps.params.outputs.model }}
        prompt-file: ${{ steps.params.outputs.prompt }}
        output-path: ${{ steps.params.outputs.output }}
        extra-args: ${{ inputs.extra-args }}

    - name: 문서화 실행
      if: steps.params.outputs.mode == 'docs'
      id: docs
      uses: ./.github/actions/documentation
      with:
        codex-version: ${{ inputs.codex-version }}
        model: ${{ steps.params.outputs.model }}
        prompt-file: ${{ steps.params.outputs.prompt }}
        output-path: ${{ steps.params.outputs.output }}
        extra-args: ${{ inputs.extra-args }}

    - name: Issue Up 실행
      if: steps.params.outputs.mode == 'issue'
      id: issue
      uses: ./.github/actions/issue-up
      with:
        codex-version: ${{ inputs.codex-version }}
        model: ${{ steps.params.outputs.model }}
        prompt-file: ${{ steps.params.outputs.prompt }}
        output-path: ${{ steps.params.outputs.output }}
        extra-args: ${{ inputs.extra-args }}
